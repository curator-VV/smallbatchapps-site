<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Batch Apps</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f4ec;
    --surface: #fffdf7;
    --ink: #24291f;
    --ink-soft: #55604c;
    --rule: #ddd7c6;
    --accent: #1f5c3a;
    --accent-soft: #e6efe6;
    --ph-bg: #eae4d2;
    --ph-ink: #4a4433;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #14170f;
      --surface: #1b1f16;
      --ink: #ece8dc;
      --ink-soft: #a9b3a0;
      --rule: #333a2c;
      --accent: #7fc79b;
      --accent-soft: #1f2b21;
      --ph-bg: #2b3122;
      --ph-ink: #d8d2bd;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.62;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 1.75rem 1.15rem 4rem; }
  .band { color:#fff; background:linear-gradient(135deg,#2f9a5c 0%,#1f6b42 42%,#10304a 100%); }
  .band-inner { max-width:44rem; margin:0 auto; padding:2rem 1.15rem 1.7rem; display:flex; align-items:center; gap:1.1rem; }
  .band .icon { width:68px; height:68px; border-radius:16px; flex:0 0 auto; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .band .brand { font-size:.78rem; font-weight:650; letter-spacing:.09em; text-transform:uppercase; opacity:.85; margin:0 0 .25rem; }
  .band h1 { color:#fff; margin:0; }
  .band .sub { color:rgba(255,255,255,.82); margin:.35rem 0 0; }
  footer .links a { margin-right:1rem; }
  @media (max-width: 34rem) { .band-inner { padding:1.5rem 1rem 1.3rem; gap:.9rem; } .band .icon { width:56px; height:56px; border-radius:13px; } }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: .95rem; margin: 0; }
  h2 {
    font-size: 1.2rem; line-height: 1.3; margin: 2.4rem 0 .6rem;
    padding-top: 1.4rem; border-top: 1px solid var(--rule); color: var(--accent);
  }
  h2:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  h3 { font-size: 1.02rem; margin: 1.6rem 0 .35rem; color: var(--ink); }
  p { margin: 0 0 .9rem; }
  ul, ol { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin-bottom: .45rem; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  strong { font-weight: 650; }
  .ph {
    background: var(--ph-bg); color: var(--ph-ink);
    padding: .05em .35em; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88em; word-break: break-word;
  }
  .contact {
    background: var(--accent-soft); border-radius: 8px;
    padding: 1.1rem 1.15rem; margin-bottom: 1.6rem;
  }
  .contact p:last-child { margin-bottom: 0; }
  .contact .email { font-size: 1.05rem; }
  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; padding: .9rem 1rem; margin: 1.1rem 0;
  }
  .card p:last-child, .card ul:last-child { margin-bottom: 0; }
  .faq { margin-top: .5rem; }
  .legal { font-size: .72rem; opacity: .7; margin: .4rem 0 0; }
  footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); color: var(--ink-soft); font-size: .9rem; }
  @media (max-width: 34rem) {
    body { font-size: 16px; }
    .wrap { padding: 1.4rem 1rem 3rem; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
